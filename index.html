<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joemy Even's - Recherche Karaoké</title>
<style>
body{
font-family:Arial,sans-serif;
background:#111;
color:white;
padding:20px;
text-align:center;
}
h1{
color:#d4af37;
}
input{
width:90%;
max-width:500px;
padding:12px;
font-size:18px;
border-radius:8px;
border:none;
}
ul{
list-style:none;
padding:0;
}
li{
padding:8px;
border-bottom:1px solid #333;
}
</style>
</head>
<body>

<h1>🎤 Joemy Even's</h1>
<h2>Recherche de titres Karaoké</h2>

<input type="text" id="search" placeholder="Rechercher un titre ou un artiste...">

<ul id="songs">
<li>Les titres seront ajoutés ici</li>
</ul>

<script>
const search = document.getElementById('search');
const songs = document.querySelectorAll('#songs li');

search.addEventListener('keyup', function() {
const value = this.value.toLowerCase();
songs.forEach(song => {
song.style.display =
song.textContent.toLowerCase().includes(value)
? ''
: 'none';
});
});
</script>

</body>
</html>
