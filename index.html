from pathlib import Path



html = """<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Joemy Even's - Karaoké</title>

<style>

body{

background:#111;

color:white;

font-family:Arial,sans-serif;

text-align:center;

padding:20px;

}

h1{color:#d4af37;}

input{

width:90%;

max-width:500px;

padding:12px;

font-size:18px;

border-radius:8px;

border:none;

margin-bottom:20px;

}

#counter{

color:#d4af37;

margin-bottom:15px;

}

ul{

list-style:none;

padding:0;

max-width:800px;

margin:auto;

}

li{

padding:10px;

border-bottom:1px solid #333;

text-align:left;

}

</style>

</head>

<body>

<h1>🎤 JOEMY EVEN'S</h1>

<h2>Recherche Karaoké</h2>



<input type="text" id="search" placeholder="Rechercher un titre ou un artiste">

<div id="counter"></div>



<ul id="songs"></ul>



<script>

const songList = [

"Adele - Hello",

"Adele - Someone Like You",

"Adele - Rolling In The Deep",

"Amir - J'ai cherché",

"Amel Bent - Ma philosophie",

"Andrea Bocelli - Vivo per lei",

"Angèle - Balance ton quoi",

"Bon Jovi - It's My Life",

"Bruno Mars - Uptown Funk",

"Coldplay - Viva La Vida",

"Ed Sheeran - Perfect",

"Queen - Bohemian Rhapsody",

"Vianney - Pas là",

"Zaz - Je veux"

];



const songsContainer = document.getElementById("songs");



songList.forEach(title => {

  const li = document.createElement("li");

  li.textContent = title;

  songsContainer.appendChild(li);

});



const search = document.getElementById("search");



function updateCounter(){

  const visible = [...document.querySelectorAll("#songs li")]

    .filter(li => li.style.display !== "none").length;

  document.getElementById("counter").textContent =

    visible + " chanson(s) trouvée(s)";

}



search.addEventListener("keyup", function() {

  const value = this.value.toLowerCase();



  document.querySelectorAll("#songs li").forEach(song => {

    song.style.display =

      song.textContent.toLowerCase().includes(value) ? "" : "none";

  });



  updateCounter();

});



updateCounter();

</script>

</body>

</html>

"""



out = "/mnt/data/Joemy_Evens_Karaoke_Corrige.html"

Path(out).write_text(html, encoding="utf-8")

print(out)
.
